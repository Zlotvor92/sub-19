<!doctype html>
<html lang="sr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f6f7f5;
        --ink: #19251e;
        --accent: #335e35;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <!-- Scenes: one per sub-composition; later scenes paint on top. -->
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.32"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="reveal"
        class="clip"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="2.19"
        data-duration="3.4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="result"
        class="clip"
        data-composition-id="result"
        data-composition-src="compositions/result.html"
        data-start="5.4"
        data-duration="2.47"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="goal"
        class="clip"
        data-composition-id="goal"
        data-composition-src="compositions/goal.html"
        data-start="7.65"
        data-duration="4.45"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="plan"
        class="clip"
        data-composition-id="plan"
        data-composition-src="compositions/plan.html"
        data-start="11.55"
        data-duration="3.85"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="form"
        class="clip"
        data-composition-id="form"
        data-composition-src="compositions/form.html"
        data-start="14.9"
        data-duration="4.9"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="19.55"
        data-duration="4.45"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 7"
      ></div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0). Entered at 6.55 s so its section change lands on the reveal (2.19). -->
      <audio
        id="music"
        data-start="0"
        data-duration="24"
        data-media-start="6.55"
        data-track-index="10"
        data-volume="0.32"
        data-fade-in="0.3"
        data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>

      <!-- SFX (Kenney): each peaks one frame after its picture. -->
      <audio id="sfx-roll" data-start="0.97" data-track-index="11" data-volume="0.3" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap-1" data-start="6.59" data-track-index="12" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-1" data-start="6.7" data-track-index="13" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-key-2" data-start="6.82" data-track-index="14" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap-2" data-start="7.23" data-track-index="15" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-3" data-start="7.34" data-track-index="16" data-volume="0.32" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-key-4" data-start="7.46" data-track-index="17" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-tap-3" data-start="8.03" data-track-index="18" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-5" data-start="8.13" data-track-index="19" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-key-6" data-start="8.25" data-track-index="20" data-volume="0.32" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-tap-4" data-start="8.56" data-track-index="21" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-7" data-start="8.66" data-track-index="22" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-key-8" data-start="8.77" data-track-index="23" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap-plan" data-start="11.5" data-track-index="24" data-volume="0.6" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-plan-open" data-start="11.98" data-track-index="25" data-volume="0.4" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-da" data-start="16.41" data-track-index="26" data-volume="0.5" src="assets/sfx/bong_001.ogg"></audio>
      <audio id="sfx-mark" data-start="21.95" data-track-index="27" data-volume="0.35" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
