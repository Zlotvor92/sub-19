<!doctype html>
<html lang="sr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f6f7f5;
        --ink: #19251e;
        --accent: #335e35;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <!-- "Ovaj reel je trka na 5 km." 109.96 BPM: a beat every 0.5457 s. Gun 1.09, a kilometre every 6 beats, finish 17.46. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="19.65"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <div id="start" class="clip" data-composition-id="start" data-composition-src="compositions/start.html"
        data-start="0" data-duration="1.09" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

</html>
