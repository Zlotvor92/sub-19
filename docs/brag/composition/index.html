<!doctype html>
<html lang="sr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f6f7f5;
        --ink: #19251e;
        --accent: #335e35;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <!-- 120 BPM grid: a beat every 0.5 s, a bar every 2 s. Cuts land on beats. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <!-- Scenes: one per sub-composition; later scenes paint on top. -->
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="reveal"
        class="clip"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="2"
        data-duration="2.05"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="result"
        class="clip"
        data-composition-id="result"
        data-composition-src="compositions/result.html"
        data-start="3.9"
        data-duration="2.2"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="goal"
        class="clip"
        data-composition-id="goal"
        data-composition-src="compositions/goal.html"
        data-start="5.9"
        data-duration="3.55"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="plan"
        class="clip"
        data-composition-id="plan"
        data-composition-src="compositions/plan.html"
        data-start="9.35"
        data-duration="2.15"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="weeks"
        class="clip"
        data-composition-id="weeks"
        data-composition-src="compositions/weeks.html"
        data-start="11.5"
        data-duration="1.5"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>
      <div
        id="form"
        class="clip"
        data-composition-id="form"
        data-composition-src="compositions/form.html"
        data-start="13"
        data-duration="3"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 7"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="16"
        data-duration="4"
        data-track-index="8"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 8"
      ></div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0). Entered at 13.02 s so the track's louder section B lands on the logo cut (2.0 s). -->
      <audio
        id="music"
        data-start="0"
        data-duration="20"
        data-media-start="13.02"
        data-track-index="10"
        data-volume="0.32"
        data-fade-out="1"
        src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"
      ></audio>

      <!-- SFX (Kenney): each peaks one frame after its picture. -->
      <audio id="sfx-tick-1" data-start="0.28" data-track-index="11" data-volume="0.35" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tick-2" data-start="0.53" data-track-index="12" data-volume="0.35" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-tick-3" data-start="0.78" data-track-index="13" data-volume="0.35" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-stop" data-start="1.03" data-track-index="14" data-volume="0.5" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-logo" data-start="2.03" data-track-index="15" data-volume="0.5" src="assets/sfx/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-tap-1" data-start="4.53" data-track-index="16" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-1" data-start="4.63" data-track-index="17" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-key-2" data-start="4.73" data-track-index="18" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap-2" data-start="5.03" data-track-index="19" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-3" data-start="5.13" data-track-index="20" data-volume="0.32" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-key-4" data-start="5.23" data-track-index="21" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-tap-3" data-start="6.28" data-track-index="22" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-5" data-start="6.35" data-track-index="23" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-key-6" data-start="6.43" data-track-index="24" data-volume="0.32" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-tap-4" data-start="6.53" data-track-index="25" data-volume="0.5" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-key-7" data-start="6.61" data-track-index="26" data-volume="0.32" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-key-8" data-start="6.69" data-track-index="27" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap-plan" data-start="9.03" data-track-index="28" data-volume="0.6" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-plan-cut" data-start="9.38" data-track-index="29" data-volume="0.45" src="assets/sfx/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-week-2" data-start="11.53" data-track-index="30" data-volume="0.28" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-week-3" data-start="11.655" data-track-index="31" data-volume="0.28" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-week-4" data-start="11.78" data-track-index="32" data-volume="0.28" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-week-5" data-start="11.905" data-track-index="33" data-volume="0.28" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-week-6" data-start="12.03" data-track-index="34" data-volume="0.28" src="assets/sfx/click_002.ogg"></audio>
      <audio id="sfx-week-7" data-start="12.155" data-track-index="35" data-volume="0.28" src="assets/sfx/click_005.ogg"></audio>
      <audio id="sfx-week-8" data-start="12.28" data-track-index="36" data-volume="0.32" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-da" data-start="13.53" data-track-index="37" data-volume="0.5" src="assets/sfx/bong_001.ogg"></audio>
      <audio id="sfx-mark" data-start="17.53" data-track-index="38" data-volume="0.4" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
