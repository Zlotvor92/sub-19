  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 0.5457;

    const ids = Array.from({ length: 13 }, (_, i) => `#km3-w${i + 1}`);
    gsap.set(ids.slice(1).concat("#km3-race"), { opacity: 0 });
