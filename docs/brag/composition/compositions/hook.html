<template>
  <style>
    @font-face {
      font-family: "Figtree";
      font-weight: 300 900;
      src: url("assets/fonts/figtree-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2191, U+2193, U+2212;
    }
    @font-face {
      font-family: "Figtree";
      font-weight: 300 900;
      src: url("assets/fonts/figtree-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Figtree", sans-serif;
      color: #19251e;
    }
    #hook-time {
      position: absolute;
      left: 165px;
      top: 470px;
      width: 750px;
      height: 300px;
      display: flex;
      color: #19251e;
    }
    .hook-col {
      width: 170px;
      height: 300px;
      overflow: hidden;
      position: relative;
      font-size: 300px;
      line-height: 300px;
      font-weight: 300;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .hook-colon {
      width: 70px;
      height: 300px;

      line-height: 300px;
      font-weight: 300;
      text-align: center;
    }
    #hook-strip {
      position: absolute;
      left: 0;
      top: 0;
      width: 170px;
    }
    #hook-strip span {
      display: block;
      height: 300px;
    }
    #hook-line {
      position: absolute;
      left: 0;
      width: 1080px;
      top: 840px;
      text-align: center;
      font-size: 72px;
      font-weight: 600;
      color: #19251e;
      letter-spacing: -0.01em;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <!-- Race clock counting up on the eighth notes and stopping at 19:59. -->
    <div id="hook-time" data-layout-allow-overflow>
      <div class="hook-col">1</div>
      <div class="hook-col">9</div>
      <div class="hook-colon">:</div>
      <div class="hook-col">5</div>
      <div class="hook-col"><div id="hook-strip"><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
    </div>
    <div id="hook-line">Jedna sekunda.</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#hook-strip", { y: 0, filter: "blur(0px)" });
    gsap.set("#hook-line", { opacity: 0, filter: "blur(8px)" });
    gsap.set("#hook-time", { scale: 1, color: "#19251e", transformOrigin: "50% 50%" });
    // 19:55 → 19:59, one tick per eighth note (0.25 s); the last digit rolls up with a short vertical smear.
    [1, 2, 3, 4].forEach((k) => {
      const t = k * 0.25;
      tl.to("#hook-strip", { y: -300 * k, duration: 0.1, ease: "power3.out" }, t);
      tl.fromTo("#hook-strip", { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.04, ease: "none", immediateRender: false }, t);
      tl.to("#hook-strip", { filter: "blur(0px)", duration: 0.08, ease: "power2.out" }, t + 0.04);
    });
    // Stop on the beat (1.0 s): the clock turns green and punches once.
    tl.set("#hook-time", { color: "#335e35" }, 1.0);
    tl.fromTo("#hook-time", { scale: 1.07 }, { scale: 1, duration: 0.25, ease: "expo.out", immediateRender: false }, 1.0);
    tl.fromTo(
      "#hook-line",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.1, ease: "power4.out" },
      1.1
    );
    // Hard cut to the logo at 2.0 s (scene ends).
    window.__timelines["hook"] = tl;
  </script>
