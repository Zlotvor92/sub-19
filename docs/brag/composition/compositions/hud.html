<template>
  <style>
    @font-face {
      font-family: "Figtree";
      font-weight: 300 900;
      src: url("assets/fonts/figtree-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2191, U+2193, U+2212;
    }
    @font-face {
      font-family: "Figtree";
      font-weight: 300 900;
      src: url("assets/fonts/figtree-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Figtree", sans-serif;
    }
    #hud-pill {
      position: absolute;
      left: 60px;
      top: 180px;
      width: 470px;
      height: 124px;
      border-radius: 62px;
      background: #335e35;
      color: #ffffff;
    }
    #hud-dist {
      position: absolute;
      left: 44px;
      top: 38px;
      font-size: 46px;
      line-height: 48px;
      font-weight: 700;
    }
    #hud-clock {
      position: absolute;
      left: 150px;
      top: 14px;
      font-size: 96px;
      line-height: 96px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    #hud-track {
      position: absolute;
      left: 560px;
      top: 235px;
      width: 460px;
      height: 14px;
      border-radius: 7px;
      background: rgba(25, 37, 30, 0.14);
      overflow: hidden;
    }
    #hud-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 460px;
      height: 14px;
      background: #335e35;
    }
    .hud-tick {
      position: absolute;
      top: 0;
      width: 3px;
      height: 14px;
      background: #f6f7f5;
    }
    #hud-sprint {
      position: absolute;
      inset: 0;
      background: #335e35;
      color: #ffffff;
    }
    #hud-big {
      position: absolute;
      left: 0;
      width: 1080px;
      top: 520px;
      text-align: center;
      font-size: 300px;
      line-height: 300px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <!-- The race clock: runs from the gun (1.09 s) and stops at 19:59 on the finish (17.46 s). -->
    <div id="hud-sprint"><div id="hud-big">00:00</div></div>
    <div id="hud-pill"><div id="hud-dist">5K</div><div id="hud-clock">00:00</div></div>
    <div id="hud-track">
      <div id="hud-fill"></div>
      <div class="hud-tick" style="left: 92px"></div>
      <div class="hud-tick" style="left: 184px"></div>
      <div class="hud-tick" style="left: 276px"></div>
      <div class="hud-tick" style="left: 368px"></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const RACE = 16.3; // gun (1.09 s) to 19:59 just before the finish cut (17.46 s)
    const B = 0.5457;
    const clock = { s: 0 };
    const pad = (n) => String(n).padStart(2, "0");
    // While a split card is up (km k at 6k beats after the gun, one beat long), the clock shows that split: 03:59, 07:59, 11:59, 15:59.
    const splitAt = (t) => {
      for (let k = 1; k <= 4; k++) {
        const t0 = 6 * k * B;
        if (t >= t0 - 0.001 && t < t0 + B) return 240 * k - 1;
      }
      return null;
    };
    const draw = () => {
      const t = (clock.s / 1199) * RACE;
      const split = splitAt(t);
      const s = split ?? Math.min(1199, Math.floor(clock.s));
      const txt = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
      document.getElementById("hud-clock").textContent = txt;
      document.getElementById("hud-big").textContent = txt;
    };
    gsap.set("#hud-sprint", { opacity: 0 });
    gsap.set("#hud-fill", { scaleX: 0, transformOrigin: "0% 50%" });
    // Clock and distance are pure functions of scene time.
    tl.fromTo(clock, { s: 0 }, { s: 1199, duration: RACE, ease: "none", onUpdate: draw, onStart: draw }, 0);
    tl.fromTo("#hud-fill", { scaleX: 0 }, { scaleX: 1, duration: RACE, ease: "none" }, 0);
    // The gun: the pill drops into place.
    tl.fromTo("#hud-pill", { y: -40, scale: 1.1 }, { y: 0, scale: 1, duration: 0.2, ease: "expo.out", transformOrigin: "0% 50%" }, 0);
    // Final sprint (16.92 s): the clock takes the whole screen for the last metres.
    tl.set("#hud-sprint", { opacity: 1 }, 15.83);
    tl.set(["#hud-pill", "#hud-track"], { opacity: 0 }, 15.83);
    tl.fromTo("#hud-big", { scale: 1.12 }, { scale: 1, duration: 0.2, ease: "expo.out", transformOrigin: "50% 50%", immediateRender: false }, 15.83);
    window.__timelines["hud"] = tl;
  </script>
</template>
