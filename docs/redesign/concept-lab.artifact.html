<style>:root{--bg:#111214;--panel:#191b1e;--line:#2a2d32;--txt:#e9eaec;--dim:#9a9ea6;--acc:#ffb347;--topbg:rgba(17,18,20,.94);--hov:#262a30;--sel:#454a52;--inv:#111214;--win:rgba(255,179,71,.09);--s5:#7fe2a3;--s4:#cfe9a0;--s3:#e6e6e6;--s2:#f1b38a;--s1:#ef8a8a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2f4;--panel:#ffffff;--line:#d6d9de;--txt:#16181c;--dim:#59606a;--acc:#a85a00;--topbg:rgba(241,242,244,.94);--hov:#e6e8ec;--sel:#b4bac3;--inv:#ffffff;--win:rgba(168,90,0,.09);--s5:#14753f;--s4:#4d7a14;--s3:#2a2d33;--s2:#a8501a;--s1:#b42323;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1f2f4;--panel:#ffffff;--line:#d6d9de;--txt:#16181c;--dim:#59606a;--acc:#a85a00;--topbg:rgba(241,242,244,.94);--hov:#e6e8ec;--sel:#b4bac3;--inv:#ffffff;--win:rgba(168,90,0,.09);--s5:#14753f;--s4:#4d7a14;--s3:#2a2d33;--s2:#a8501a;--s1:#b42323;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);padding-block:0;font:15px/1.5 "Inter",system-ui,sans-serif;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lab-top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lab-bar{display:flex;align-items:center;gap:14px;padding:12px 16px 8px;flex-wrap:wrap}
.lab-title{font-weight:800;letter-spacing:.04em;font-size:14px}
.lab-title span{color:var(--acc)}
.lab-sub{color:var(--dim);font-size:12px}
.views{display:flex;gap:4px;margin-left:auto}
.views button,.chips button,.screens button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--dim);border:1px solid transparent}
.views button[aria-pressed=true]{background:var(--hov);color:var(--txt);border-color:var(--line)}
.chips{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);color:var(--dim);font-variant-numeric:tabular-nums}
.chips button b{color:var(--txt);margin-right:6px;font-weight:800}
.chips button[aria-pressed=true]{background:var(--txt);color:var(--inv);border-color:var(--txt)}
.chips button[aria-pressed=true] b{color:var(--inv)}
.screens{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.screens button{flex:none;border:1px solid var(--line)}
.screens button[aria-pressed=true]{background:var(--hov);color:var(--txt);border-color:var(--sel)}
.lab-main{padding:20px 16px 80px;max-width:1200px;margin:0 auto}
.one{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:32px;align-items:start;justify-content:center}
@media(max-width:860px){.one{grid-template-columns:1fr;justify-items:center}}
.pw{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:46px;background:#000;border:10px solid #000;box-shadow:0 0 0 1px #3a3d44,0 30px 60px rgba(0,0,0,.5);overflow:hidden;transform-origin:0 0}
.phone .scr{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:36px;overflow:hidden}
.scr .body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:50px}
.scr .body::-webkit-scrollbar{display:none}
.scr .foot{flex:none}
.sb{position:absolute;z-index:50;top:0;left:0;right:0;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 14px/1 "Inter",system-ui,sans-serif;color:var(--sb,#fff);pointer-events:none}
.sb i{display:inline-block;width:24px;height:11px;border:1.5px solid currentColor;border-radius:3.5px;position:relative;opacity:.85}
.sb i::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.hi{position:absolute;z-index:50;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--sb,#fff);opacity:.55;pointer-events:none}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:640px}
.spec h2{font-size:22px;line-height:1.15;letter-spacing:-.01em}
.spec .tag{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.spec .lede{color:var(--dim);margin:8px 0 14px}
.spec dl{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;font-size:13.5px}
.spec dt{color:var(--dim);font-weight:600}
.spec dd{color:var(--txt)}
@media(max-width:520px){.spec dl{grid-template-columns:1fr;gap:2px 0}.spec dt{margin-top:8px}}
.spec .cost{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 18px;justify-items:center}
.cmp figure{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.cmp figcaption{font-size:12px;color:var(--dim);font-weight:600;text-align:center}
.cmp figcaption b{color:var(--txt)}
.cmp figure:hover figcaption b{color:var(--acc)}
table.mx{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
.mxw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.mx th,.mx td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.mx thead th{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.mx tr.win td{background:var(--win)}
.mx td.s5{color:var(--s5);font-weight:800}.mx td.s4{color:var(--s4)}.mx td.s3{color:var(--s3)}.mx td.s2{color:var(--s2)}.mx td.s1{color:var(--s1);font-weight:700}
.note{color:var(--dim);font-size:13px;max-width:760px;margin:14px 0}
.note b{color:var(--txt)}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.aud div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px}
.aud h3{font-size:13px;color:var(--acc);margin-bottom:6px;letter-spacing:.02em}
.aud li{margin:4px 0 4px 16px;color:var(--txt)}
.aud li span{color:var(--dim)}
.befores{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 18px}
.befores figure{flex:none;width:260px}
.befores img{width:260px;border-radius:14px;border:1px solid var(--line);display:block}
.befores figcaption{font-size:12px;color:var(--dim);margin-top:6px}
h2.sec{font-size:18px;margin:26px 0 8px}
/* generičke animacije koje koncepti mogu da koriste */
@keyframes lab-ring{from{stroke-dashoffset:var(--c)}}
@keyframes lab-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes lab-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes lab-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lab-fade{from{opacity:0}to{opacity:1}}
@keyframes lab-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ring-val{animation:lab-ring .9s cubic-bezier(.3,.7,.2,1) both .15s}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lab-draw .9s cubic-bezier(.4,.1,.2,1) both .1s}
.wipe{animation:lab-wipe .9s cubic-bezier(.4,.1,.2,1) both .5s}
.rise{animation:lab-rise .46s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.pbar,.rbar{transform-box:fill-box;transform-origin:bottom;animation:lab-grow .6s cubic-bezier(.3,.7,.2,1) both}
.pbar{animation-delay:calc(var(--d,0)*1s + .1s)}
.rbar{animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){.ring-val,.draw,.wipe,.rise,.pbar,.rbar,.scr *{animation:none!important;transition:none!important}}
</style>

  const off = c * (1 - clamp(share, 0, 1));
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle class="ring-val" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="${cap}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="--c:${c.toFixed(1)}" transform="rotate(-90 50 50)"/>${
    text ? `<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="${tsize}" font-weight="${tw}" fill="${tcolor}" style="font-family:${tfont};font-variant-numeric:tabular-nums">${text}</text>` : ''

}

/* SPARKLINE */
function spark(vals, o = {}) {
  const { w = 80, h = 28, color = 'currentColor', sw = 1.6, fill = '', dot = true, min, max, pad = 3, dash = '', cls = '' } = o;
  const lo = min ?? Math.min(...vals);
  const hi = max ?? Math.max(...vals);
  const X = (i) => pad + (i / (vals.length - 1)) * (w - pad * 2);
  const Y = (v) => h - pad - ((v - lo) / (hi - lo || 1)) * (h - pad * 2);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = fill ? `<polygon points="${pad},${h - pad} ${pts.join(' ')} ${w - pad},${h - pad}" fill="${fill}" stroke="none"/>` : '';
  const last = vals.length - 1;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${area}<polyline class="draw" pathLength="1" points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>${dot ? `<circle cx="${X(last).toFixed(1)}" cy="${Y(vals[last]).toFixed(1)}" r="${sw + 1}" fill="${color}"/>` : ''}</svg>`;
}

/* SESIJA — profil intenziteta po vremenu (visina stuba = brzina). Segmenti: zagrevanje, 7 × (brzo + oporavak), hlađenje. */
function sessionSegments() {
  const s = D.session;
  const segs = [{ k: 'wu', t: s.wuSec, p: s.easyPace }];
  for (let i = 0; i < s.reps; i++) {
    segs.push({ k: 'rep', t: s.repSec, p: s.workPace, i });
    segs.push({ k: 'rec', t: s.restSec, p: s.easyPace, i });
  }
  segs.pop(); /* posle poslednjeg ponavljanja ide odmah hlađenje */
  segs.push({ k: 'cd', t: s.cdSec, p: s.easyPace });
  return segs;
}
function profile(o = {}) {
  const { w = 340, h = 110, pad = 0, gap = 1.2, easy = '#777', work = '#fff', rec, r = 2, base = '', ymin = 225, ymax = 330, labels = false, cls = '', txt = '#888', font = '' } = o;
  const segs = sessionSegments();
  const total = segs.reduce((a, s) => a + s.t, 0);
  let x = pad;
  const inner = w - pad * 2;
  let out = '';
  const Y = (p) => pad + ((p - ymin) / (ymax - ymin)) * (h - pad * 2 - 14);
  const bottom = h - 14 - pad;
  const spans = {};
  segs.forEach((s) => {
    const sw = (s.t / total) * inner;
    const top = Y(s.p);
    const col = s.k === 'rep' ? work : s.k === 'rec' && rec ? rec : easy;
    out += `<rect class="pbar" style="--d:${(x / w).toFixed(2)}" x="${(x + gap / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${Math.max(1, sw - gap).toFixed(1)}" height="${(bottom - top + 14 * 0).toFixed(1)}" rx="${r}" fill="${col}"/>`;
    spans[s.k] = spans[s.k] || [x, x];
    spans[s.k][1] = x + sw;
    x += sw;
  });
  if (base) out += `<line x1="${pad}" y1="${bottom + 0.5}" x2="${w - pad}" y2="${bottom + 0.5}" stroke="${base}"/>`;
  if (labels) {
    const L = (a, b, t, anchor = 'middle') => `<text x="${anchor === 'middle' ? (a + b) / 2 : a}" y="${h - 2}" text-anchor="${anchor}" font-size="9" fill="${txt}" style="font-family:${font}">${t}</text>`;
    out += L(spans.wu[0], spans.wu[1], `ZAGREVANJE ${kmf(D.session.wuKm)} km`);
    out += L(spans.rep[0], spans.cd[0], `7 × 60 s`);
    out += L(spans.cd[0], spans.cd[1], `HLAĐENJE ${kmf(D.session.cdKm)} km`);
  }
  return { svg: `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="100%" aria-hidden="true">${out}</svg>`, spans, total, w, h, bottom };
}

/* „fotografija“ — topografske izohipse (zamena za fotografiju korisnika; u produkciji bi ovde stajao Strava/korisnički snimak ili generisana mapa rute). */
function topo(w, h, o = {}) {
  const { bg = '#2e2a22', line = '#8c7e5c', accent = '#d9683f', n = 16, seed = 1, op = 0.55 } = o;
  let out = `<rect width="${w}" height="${h}" fill="${bg}"/>`;
  const rnd = (i) => Math.sin(i * 127.1 + seed * 311.7) * 0.5 + 0.5;
  const hills = [[w * 0.28, h * 0.62, 1], [w * 0.78, h * 0.34, 0.8], [w * 0.55, h * 0.95, 0.9]];
  hills.forEach(([cx, cy, sc], hi) => {
    for (let k = 1; k <= n; k++) {
      const r0 = k * (h / 15) * sc;
      let d = '';
      for (let a = 0; a <= 72; a++) {
        const t = (a / 72) * Math.PI * 2;
        const r = r0 * (1 + 0.14 * Math.sin(3 * t + hi + seed) + 0.08 * Math.sin(5 * t + k * 0.15 + hi));
        d += `${a ? 'L' : 'M'}${(cx + Math.cos(t) * r * 1.35).toFixed(1)},${(cy + Math.sin(t) * r).toFixed(1)}`;
      }
      out += `<path d="${d}Z" fill="none" stroke="${line}" stroke-width="${k % 4 === 0 ? 1.1 : 0.6}" opacity="${op * (1 - k / (n * 1.4))}"/>`;
    }
  });
  out += `<path d="M-10,${h * 0.9} C${w * 0.25},${h * 0.55} ${w * 0.45},${h * 0.85} ${w * 0.62},${h * 0.5} S${w * 0.9},${h * 0.2} ${w + 10},${h * 0.12}" fill="none" stroke="${accent}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 0"/><circle cx="${w * 0.62}" cy="${h * 0.5}" r="5" fill="${accent}"/><circle cx="${w * 0.62}" cy="${h * 0.5}" r="11" fill="none" stroke="${accent}" opacity=".4"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;
}

const WEIGHTINGS = [
  ['Jednake težine', [1, 1, 1, 1, 1, 1, 1, 1]],
  ['Jasnoća + upotrebljivost + mobilni ×2', [2, 2, 1, 1, 1, 2, 1, 1]],

  ['Animacija + diferencijacija ×2', [1, 1, 1, 1, 2, 1, 2, 1]]
];
function MATRIX_HTML() {
  const ids = CONCEPTS.map((c) => c.id);
  const tot = (id, w) => SCORES[id].reduce((a, v, i) => a + v * w[i], 0);
  const eq = Object.fromEntries(ids.map((id) => [id, tot(id, WEIGHTINGS[0][1])]));
  const best = Math.max(...Object.values(eq));
  const rank = (w) => ids.map((id) => [id, tot(id, w)]).sort((a, b) => b[1] - a[1]);
  const nm = (id) => CONCEPTS.find((c) => c.id === id).name;
  const rows = ids
    .map((id) => `<tr class="${eq[id] === best ? 'win' : ''}"><td><b>${id}</b> ${nm(id)}</td>${SCORES[id].map((s) => `<td class="s${s}">${s}</td>`).join('')}<td><b>${eq[id]}</b></td></tr>`)

  const sens = WEIGHTINGS.map(([n, w]) => {
    const r = rank(w);
    return `<tr><td>${n}</td><td>${r.slice(0, 3).map(([id, t]) => `<b>${id}</b> ${nm(id)} <span style="color:var(--dim)">${t}</span>`).join(' · ')}</td></tr>`;
  }).join('');
  const inTop3 = ids.map((id) => [id, WEIGHTINGS.filter(([, w]) => rank(w).slice(0, 3).some(([x]) => x === id)).length]).filter(([, n]) => n === WEIGHTINGS.length).map(([id]) => id);

/* CSS koncepta se prefiksira klasom `.cNN`, da deset stilova ne može da se meša. */
function scopeCss(css, scope) {
  let i = 0;
  let out = '';
  const n = css.length;
  const skipBlock = (from) => {
    let d = 0;
    let j = from;
    for (; j < n; j++) {
      if (css[j] === '{') d++;
      else if (css[j] === '}') {
        d--;
        if (d === 0) return j + 1;
      }
    }
    return n;
  };
  const rules = (text) => {
    let o = '';
    let k = 0;
    while (k < text.length) {
      const brace = text.indexOf('{', k);
      if (brace < 0) break;
      const sel = text.slice(k, brace).trim();
      let d = 0;
      let e = brace;
      for (; e < text.length; e++) {
        if (text[e] === '{') d++;
        else if (text[e] === '}') {
          d--;
          if (d === 0) break;
        }
      }
      const body = text.slice(brace + 1, e);
      if (sel.startsWith('@keyframes') || sel.startsWith('@font-face')) o += `${sel}{${body}}`;
      else if (sel.startsWith('@media') || sel.startsWith('@supports')) o += `${sel}{${rules(body)}}`;
      else
        o += `${sel
          .split(',')
          .map((s) => {
            s = s.trim();
            if (s === '&' || s === ':scope') return scope;
            if (s.startsWith('&')) return scope + s.slice(1);
            return `${scope} ${s}`;
          })
          .join(',')}{${body}}`;
      k = e + 1;
    }
    return o;
  };
  return rules(css.replace(/\/\*[\s\S]*?\*\//g, ''));
}

const C0 = {
  id: '00',
  name: 'TRENUTNO',
  tag: 'Stanje danas',
  fonts: '',
  css: '',
  screens: {},
  spec: {}
};

const state = { view: 'one', c: '01', s: 'today' };
const byId = (id) => (id === '00' ? C0 : CONCEPTS.find((c) => c.id === id));
const root = document.getElementById('app');

function sizePhone(scale) {
  return `width:${390 * scale}px;height:${844 * scale}px`;
}
function phone(c, s, scale) {
  let inner;
  if (c.id === '00') {
    const src = BEFORE[{ today: '10-danas-pending-fold', workout: '22-day-sheet', plan: '20-plan-fold', progress: '40-trka-fold' }[s]];
    inner = `<div class="scr" style="background:#0b0a1f"><img src="${src}" alt="Trenutni ekran" style="width:100%;height:100%;object-fit:cover;object-position:top"></div>`;
  } else {
    inner = `<div class="scr ${'c' + c.id}" data-s="${s}">${c.screens[s]()}<div class="sb"><span>07:30</span><i></i></div><div class="hi"></div></div>`;
  }
  return `<div class="pw" style="${sizePhone(scale)}"><div class="phone" style="transform:scale(${scale})">${inner}</div></div>`;
}
function specHtml(c) {
  if (c.id === '00') return auditHtml();
  const S = c.spec;
  const rows = [
    ['Filozofija', S.philosophy],
    ['Tipografija', S.type],
    ['Layout', S.layout],
    ['Navigacija', S.nav],
    ['Today', S.today],
    ['Training plan', S.plan],
    ['Workout card', S.workout],
    ['Progres / podaci', S.data],
    ['Animacija', S.motion],
    ['Mobilni model', S.mobile],
    ['Desktop model', S.desktop],
    ['Ključni ekran', S.key]
  ];
  return `<div class="spec"><div class="tag">Koncept ${c.id}</div><h2>${c.name}</h2><p class="lede">${c.tag}</p><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><p class="cost"><b>Cena u produkciji:</b> ${S.cost}</p></div>`;
}
function auditHtml() {
  return `<div class="spec"><div class="tag">Koncept 00</div><h2>Trenutni UI (referenca)</h2><p class="lede">Isti podaci, isti viewport 390 × 844. Snimljeno iz stvarne aplikacije (nedelja 6 od 12, plan 5K sub-20).</p>${AUDIT.short}</div>`;
}

function render() {
  const c = byId(state.c);
  const vp = Math.min(window.innerWidth - 32, 1200);
  let main = '';
  if (state.view === 'one') {
    const scale = Math.min(1, (window.innerWidth - 32) / 390);
    main = `<div class="one">${phone(c, state.s, scale)}${specHtml(c)}</div>`;
  } else if (state.view === 'cmp') {
    const scale = 0.55;
    main = `<p class="note"><b>Isti ekran, 11 pravaca.</b> Dodir otvara koncept u punoj veličini. Ekran: <b>${SCREENS.find((x) => x[0] === state.s)[1]}</b>.</p><div class="cmp">${[C0, ...CONCEPTS].map((k) => `<figure data-c="${k.id}">${phone(k, state.s, scale)}<figcaption><b>${k.id}</b> ${k.name}</figcaption></figure>`).join('')}</div>`;
  } else if (state.view === 'mx') {
    main = MATRIX_HTML();
  } else if (state.view === 'aud') {
    main = AUDIT.full();
  }
  const bar = `
  <div class="lab-top">
    <div class="lab-bar"><div><div class="lab-title">SUB<span>-20</span> · LABORATORIJA KONCEPATA</div><div class="lab-sub">10 pravaca · iste informacije · isti ekrani · plan i VDOT iz stvarnog generatora</div></div>
      <div class="views">${[['one', 'Pregled'], ['cmp', 'Uporedi'], ['mx', 'Ocena'], ['aud', 'Audit']].map(([v, t]) => `<button data-v="${v}" aria-pressed="${state.view === v}">${t}</button>`).join('')}</div></div>
    ${state.view === 'one' ? `<div class="chips" role="tablist">${[C0, ...CONCEPTS].map((k) => `<button data-c="${k.id}" aria-pressed="${state.c === k.id}"><b>${k.id}</b>${k.name}</button>`).join('')}</div>` : ''}
    ${state.view === 'one' || state.view === 'cmp' ? `<div class="screens">${SCREENS.map(([k, t]) => `<button data-s="${k}" aria-pressed="${state.s === k}">${t}</button>`).join('')}</div>` : ''}
  </div>
  <main class="lab-main">${main}</main>`;
  root.innerHTML = bar;
  if (state.view === 'one') document.querySelector('.chips button[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  try {
    history.replaceState(null, '', `#v=${state.view}&c=${state.c}&s=${state.s}`);
  } catch {}
}

root.addEventListener('click', (e) => {
  const lay = e.target.closest('[data-layer]');
  if (lay) {
    const box = lay.closest('[data-layers]');
    box.classList.toggle('hide-' + lay.dataset.layer);
    lay.setAttribute('aria-pressed', String(!box.classList.contains('hide-' + lay.dataset.layer)));
    return;
  }
  const acc = e.target.closest('[data-acc]');
  if (acc) {
    const ly = acc.closest('.ly');
    ly.classList.toggle('open');
    acc.setAttribute('aria-expanded', String(ly.classList.contains('open')));
    return;
  }
  const b = e.target.closest('[data-v],[data-c],[data-s]');
  if (!b) return;
  if (b.dataset.v) state.view = b.dataset.v;
  if (b.dataset.c) {
    state.c = b.dataset.c;
    if (b.closest('figure')) state.view = 'one';
  }
  if (b.dataset.s) state.s = b.dataset.s;
  render();
  if (b.closest('figure')) window.scrollTo(0, 0);
});

/* init */
(function init() {
  const m = /#v=(\w+)&c=(\d+)&s=(\w+)/.exec(location.hash);
  if (m) {
    state.view = m[1];
    state.c = m[2];
    state.s = m[3];
  }
  const style = document.createElement('style');
  style.textContent = CONCEPTS.map((c) => scopeCss(c.css, '.c' + c.id)).join('\n');
  document.head.appendChild(style);
  render();
})();
