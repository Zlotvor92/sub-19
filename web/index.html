<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` je namerno UKLONJEN: blokira pinch-zoom (WCAG 2.1 SC 1.4.4). Slučajan zoom pri dvostrukom dodiru sprečava `touch-action:manipulation` u CSS-u. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SUB-20 · Trkački plan</title>
    <meta name="theme-color" content="#0E1217" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUB-20" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!-- Nema inline skripti: CSP u vercel.json je `script-src 'self'`. Registracija service workera je sićušan zaseban fajl koji se učitava PRE svega ostalog
         (v. komentar u sw-reg.js: registracija ne sme da čeka na ceo paket aplikacije). -->
    <script src="./sw-reg.js"></script>
  </head>
  <body>
    <!-- Uvodni ekran. Mora biti PRVI u <body> da bi se iscrtao pre svega ostalog (CSS stiže pre paketa aplikacije). Odluku „prikaži ili ne" i uklanjanje radi
         `uvod.js` — sićušan spoljni skript odmah ispod (CSP ne dozvoljava inline). Ako se skripta ne izvrši, sam se ugasi CSS animacijom i ne zaključa
         aplikaciju — zato `uvod-kraj` ostaje na `opacity:0` i element prestaje da hvata dodire. -->
    <div id="uvod" aria-hidden="true">
      <div class="zn">
        <svg viewBox="0 0 120 120" width="100%" height="100%">
          <defs>
            <linearGradient id="uvodG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5AFFBE" />
              <stop offset="55%" stop-color="#00BEDC" />
              <stop offset="100%" stop-color="#785AFF" />
            </linearGradient>
          </defs>
          <circle
            class="traka"
            cx="60"
            cy="60"
            r="44"
            fill="none"
            stroke="rgba(238,240,255,.14)"
            stroke-width="11"
          />
          <circle
            class="luk"
            cx="60"
            cy="60"
            r="44"
            fill="none"
            stroke="url(#uvodG)"
            stroke-width="11"
            stroke-linecap="round"
            stroke-dashoffset="47.63"
            transform="rotate(-59 60 60)"
          />
        </svg>
      </div>
      <div class="ime">SUB<span>·</span>20</div>
    </div>
    <script src="./uvod.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
