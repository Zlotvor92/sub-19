<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` je namerno UKLONJEN: blokira pinch-zoom (WCAG 2.1 SC 1.4.4). Slučajan zoom pri dvostrukom dodiru sprečava `touch-action:manipulation` u CSS-u. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sub20 · Trkački plan</title>
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1612" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="sub20" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!-- Nema inline skripti: CSP u vercel.json je `script-src 'self'`. Registracija service workera je sićušan zaseban fajl koji se učitava PRE svega ostalog
         (v. komentar u sw-reg.js: registracija ne sme da čeka na ceo paket aplikacije). -->
    <!-- Ručno izabrana tema (Ti → Izgled) se primenjuje pre prvog iscrtavanja; bez izbora odlučuje sistem (v. tema.js). -->
    <script src="./tema.js"></script>
    <script src="./sw-reg.js"></script>
  </head>
  <body>
    <!-- Uvodni ekran. Mora biti PRVI u <body> da bi se iscrtao pre svega ostalog (CSS stiže pre paketa aplikacije). Odluku „prikaži ili ne" i uklanjanje radi
         `uvod.js` — sićušan spoljni skript odmah ispod (CSP ne dozvoljava inline). Ako se skripta ne izvrši, sam se ugasi CSS animacijom i ne zaključa
         aplikaciju — zato `uvod-kraj` ostaje na `opacity:0` i element prestaje da hvata dodire. -->
    <div id="uvod" aria-hidden="true">
      <div class="zn"><img src="./icon-192.png" alt="" width="112" height="112" /></div>
      <div class="ime">sub20</div>
    </div>
    <script src="./uvod.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
