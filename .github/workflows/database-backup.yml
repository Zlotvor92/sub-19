name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'Missing SUPABASE_DB_URL secret'; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo 'Missing SUPABASE_BACKUP_PASSPHRASE secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/db-backup"
          export PGDATABASE="$SUPABASE_DB_URL"
          docker run --rm --network host -e PGDATABASE postgres:17 pg_dump --format=custom --no-owner --no-acl > "$RUNNER_TEMP/db-backup/database.dump"
          test -s "$RUNNER_TEMP/db-backup/database.dump"
          docker run --rm -v "$RUNNER_TEMP/db-backup:/backup:ro" postgres:17 pg_restore --list /backup/database.dump > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/db-backup/database.dump.gpg" "$RUNNER_TEMP/db-backup/database.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt "$RUNNER_TEMP/db-backup/database.dump.gpg" | cmp - "$RUNNER_TEMP/db-backup/database.dump"
          rm "$RUNNER_TEMP/db-backup/database.dump"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ${{ runner.temp }}/db-backup/database.dump.gpg
          retention-days: 30
      - name: Clean temporary export
        if: always()
        run: rm -rf "$RUNNER_TEMP/db-backup"
