name: Testovi

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Backend i konfiguracija repozitorijuma. Nema `npm install` — testovi nemaju zavisnosti, sve je iz standardne biblioteke.
      - name: Provera sintakse
        run: |
          for f in api/*.js; do node --check "$f"; done
      - name: Testovi
        run: node --test "test/**/*.test.mjs"

  # Frontend (web/) — v. docs/REWRITE_PLAN.md. Odvojen posao: testovi backenda iznad rade bez `npm install`.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipovi (strict)
        run: npm run typecheck
      - name: Lint (izolacija domena, a11y, zabrana dangerouslySetInnerHTML)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit/domain/zamrznuti oracle/node testovi
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci --prefix supabase/tests
      - run: npm test --prefix supabase/tests
