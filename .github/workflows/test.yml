name: Testovi

# Ubrzanje (organizator, 22. 10.; v. docs/testing/TEST-SPEED.md § 10):
# - samo dokumentacija (docs/** osim docs/qa/** koje testovi čitaju, *.md u korenu) ne pokreće testove;
# - samo `push` (bez `pull_request`): PR prikazuje rezultat run-a svog commita; `paths` kod `pull_request` gleda ceo PR,
#   pa bi svaki push dokumentacije pokretao run i otkazivao run koda;
# - jedna grupa po grani: nov push otkazuje stariji run (osim na main);
# - testovi weba idu u 6 paralelnih delova (vitest --shard).
on:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!docs/**'
      - 'docs/qa/**'
      - '!*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Backend i konfiguracija repozitorijuma. Nema `npm install` — testovi nemaju zavisnosti, sve je iz standardne biblioteke.
      - name: Provera sintakse
        run: |
          for f in api/*.js; do node --check "$f"; done
      - name: Testovi
        run: node --test "test/**/*.test.mjs"

  # Frontend (web/) — v. docs/REWRITE_PLAN.md. Odvojen posao: testovi backenda iznad rade bez `npm install`.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipovi (strict)
        run: npm run typecheck
      - name: Lint (izolacija domena, a11y, zabrana dangerouslySetInnerHTML)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Preserve generator A/B browser evidence
        if: always() && startsWith(github.head_ref || github.ref_name, 'qa/generator-ab')
        uses: actions/upload-artifact@v4
        with:
          name: generator-ab-browser-evidence
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn

  # Unit/domain/zamrznuti oracle/node testovi (pun nivo, `npm test`) u 6 delova; delovi se biraju heš-putanjom fajla
  # (vitest), pa svaki deo dobija deo velikih `*.full.node.test.ts`.
  web-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: web-test (${{ matrix.shard }}/6)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Testovi (deo ${{ matrix.shard }}/6)
        run: npm test -- --shard=${{ matrix.shard }}/6

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci --prefix supabase/tests
      - run: npm test --prefix supabase/tests
