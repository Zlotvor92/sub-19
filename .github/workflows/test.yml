name: Testovi

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Nema `npm install` — testovi nemaju zavisnosti, sve je iz standardne
      # biblioteke. Nema ni build koraka, jer se aplikacija deployuje bez njega.
      - name: Provera sintakse
        run: |
          for f in api/*.js sw.js; do node --check "$f"; done
      - name: Testovi
        run: node --test "test/**/*.test.mjs"

  # Novi frontend (web/) — v. docs/REWRITE_PLAN.md. Odvojen posao: stari testovi
  # iznad ostaju netaknuti i bez `npm install`, jer se produkcija i dalje
  # deployuje bez build koraka sve do cutover-a.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipovi (strict)
        run: npm run typecheck
      - name: Lint (izolacija domena, a11y, zabrana dangerouslySetInnerHTML)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit/domain/oracle testovi
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
