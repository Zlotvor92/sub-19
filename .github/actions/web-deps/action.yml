name: web-deps
description: >-
  Node 22 i web/node_modules. Keš node_modules po hešu web/package-lock.json (vraćanje ~10 s umesto npm ci ~40 s);
  bez pogotka npm ci, pa se keš snima ODMAH posle instalacije (pre testova, da u keš ne uđe ništa što posao napravi).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - id: nm
      uses: actions/cache/restore@v4
      with:
        path: web/node_modules
        key: web-node-modules-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json') }}
    - if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: web
      run: npm ci
    - if: steps.nm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: web/node_modules
        key: ${{ steps.nm.outputs.cache-primary-key }}
